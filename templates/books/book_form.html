{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h2 style="margin-bottom: 24px;">{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 24px;">
            <button class="btn" type="submit">Save Book</button>
            <a href="{% url 'book_list' %}" style="color: var(--text-muted); margin-left: 16px; text-decoration: none; font-size: 0.9rem;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
